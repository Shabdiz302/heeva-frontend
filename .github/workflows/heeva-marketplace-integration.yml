name: Heeva teacher marketplace integration

on:
  pull_request:
    paths:
      - 'services/student-api/**'
      - '.github/workflows/heeva-marketplace-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: heeva_test
          POSTGRES_PASSWORD: heeva_test_only
          POSTGRES_DB: heeva_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heeva_test -d heeva_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/student-api
    env:
      DATABASE_URL: postgresql://heeva_test:heeva_test_only@127.0.0.1:5432/heeva_marketplace_test
      COOKIE_SECURE: 'true'
      APP_ORIGINS: http://127.0.0.1:3147
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Apply schema to disposable database
        run: node src/migrate.js
      - name: Run isolated marketplace API tests
        run: node integration/marketplace-smoke.mjs

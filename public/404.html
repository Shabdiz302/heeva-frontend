<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Heeva Courses</title>
    <script>
      (function () {
        var base = '/heeva-frontend';
        var path = window.location.pathname;
        var route = path.indexOf(base) === 0 ? path.slice(base.length) : path;
        var destination = route + window.location.search + window.location.hash;
        window.location.replace(base + '/?__gh_pages_route=' + encodeURIComponent(destination));
      })();
    </script>
  </head>
  <body><p>Redirecting to Heeva Courses…</p></body>
</html>
